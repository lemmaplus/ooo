:root{
  --paper:#ffffff;
  --ink:#151515;
  --orange:#c56f24;
  --sage:#69746a;
  --coral:#d69173;
  --dot:#aaa9a5;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--paper);
}

body{
  min-height:100svh;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.doorway{
  width:min(94vw,980px);
}

#scene{
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  user-select:none;
  -webkit-user-select:none;
}

.base{
  font-family:"Afacad",
    ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400;
  fill:var(--ink);
}

.question{
  font-size:82px;
  letter-spacing:-.015em;
}

.url{
  font-size:56px;
  letter-spacing:-.012em;
}

/*
  These invisible w's are STRUCTURAL placeholders.
  They reserve the exact width of a real w at both the sentence and URL.
  Nothing collapses when a colored w moves.
*/
.w-placeholder{
  fill:transparent;
  font-weight:600;
}

.slot-dot{
  fill:var(--dot);
  pointer-events:none;
}

.mover{
  cursor:grab;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
}

.mover.dragging{cursor:grabbing}

.mover .hit{
  fill:transparent;
  pointer-events:all;
}

.mover .glyph{
  font-family:"Afacad",
    ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:600;
  text-anchor:start;
  pointer-events:none;
}

.mover:focus{outline:none}
.mover:focus-visible .hit{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 4}
#url-template{user-select:all;-webkit-user-select:all}

.w0 .glyph{fill:var(--orange)}
.w1 .glyph{fill:var(--sage)}
.w2 .glyph{fill:var(--coral)}

#drop-zone{
  fill:transparent;
  pointer-events:none;
}

#drop-zone.active{
  fill:rgba(21,21,21,.035);
}

@media(max-width:640px){
  .doorway{width:97vw}
}
</style>
</head>

<body>
<main class="doorway">
<svg id="scene" viewBox="0 0 1000 360"
     role="group" aria-label="Move the three w letters between their words and the dots.">

  <!--
    ONE fixed sentence.
    The three invisible w placeholders keep all black letters permanently still.
  -->
  <text id="question" class="base question"
        x="500" y="145" text-anchor="middle">
    <tspan id="home-slot-0" class="w-placeholder">w</tspan><tspan id="here">here</tspan><tspan> </tspan><tspan id="is">is</tspan><tspan> the </tspan><tspan id="home-slot-1" class="w-placeholder">w</tspan><tspan>hole </tspan><tspan id="home-slot-2" class="w-placeholder">w</tspan><tspan>and</tspan><tspan id="qmark">?</tspan>
  </text>
  <text id="colon" class="base question" opacity="0" aria-hidden="true" pointer-events="none">:</text>

  <!--
    ONE fixed URL line.
    It already reserves the exact typographic width of "www".
    Each dot is centered on its own destination w; it never moves that w.
  -->
  <text id="url-template" class="base url"
        x="500" y="260" text-anchor="middle">
    <tspan id="url-slot-0" class="w-placeholder">w</tspan><tspan id="url-slot-1" class="w-placeholder">w</tspan><tspan id="url-slot-2" class="w-placeholder">w</tspan><tspan>.pilemma.org</tspan>
  </text>

  <rect id="drop-zone" x="0" y="0" width="1" height="1" rx="14"></rect>

  <circle id="dot-0" class="slot-dot" r="4"></circle>
  <circle id="dot-1" class="slot-dot" r="4"></circle>
  <circle id="dot-2" class="slot-dot" r="4"></circle>

  <!--
    These are the ONLY three colored w's in the page.
    The same object travels between its word and its own URL slot.
  -->
  <g id="w-0" class="mover w0" data-index="0" role="button" tabindex="0">
    <rect class="hit" rx="3"></rect>
    <text class="glyph" x="0" y="0">w</text>
  </g>

  <g id="w-1" class="mover w1" data-index="1" role="button" tabindex="0">
    <rect class="hit" rx="3"></rect>
    <text class="glyph" x="0" y="0">w</text>
  </g>

  <g id="w-2" class="mover w2" data-index="2" role="button" tabindex="0">
    <rect class="hit" rx="3"></rect>
    <text class="glyph" x="0" y="0">w</text>
  </g>

</svg>
</main>

<script>
(() => {
  const svg = document.getElementById("scene");
  const qmark = document.getElementById("qmark");
  const isWord = document.getElementById("is");
  const colon = document.getElementById("colon");
  const hereWord = document.getElementById("here");
  const dropZone = document.getElementById("drop-zone");

  const homeSlots = [0,1,2].map(i =>
    document.getElementById(`home-slot-${i}`)
  );

  const urlSlots = [0,1,2].map(i =>
    document.getElementById(`url-slot-${i}`)
  );

  const dots = [0,1,2].map(i =>
    document.getElementById(`dot-${i}`)
  );

  const movers = [0,1,2].map(i =>
    document.getElementById(`w-${i}`)
  );

  const glyphs = movers.map(m => m.querySelector(".glyph"));
  const hits = movers.map(m => m.querySelector(".hit"));
  const measure = document.createElement("canvas").getContext("2d");
  let ink = {left:0,right:50,ascent:40,descent:0};

  const HOME_SIZE = 82;
  const URL_SIZE = 56;

  const placed = [false,false,false];
  const busy = [false,false,false];

  let home = [];
  let target = [];
  let active = null;

  function clientToSvg(evt){
    const p = svg.createSVGPoint();
    p.x = evt.clientX;
    p.y = evt.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }

  function slotOrigin(el){
    // A tspan's glyph origin is the baseline origin, not its bounding-box
    // center. Both placeholders and moving letters use weight 600.
    const start = el.getStartPositionOfChar(0);
    const end = el.getEndPositionOfChar(0);
    return {
      x:start.x,
      y:start.y,
      width:end.x-start.x
    };
  }

  function setMover(i, pos, size){
    movers[i].setAttribute(
      "transform",
      `translate(${pos.x} ${pos.y})`
    );
    glyphs[i].setAttribute("font-size", size);
    const scale = size / HOME_SIZE;
    const t = Math.max(0,Math.min(1,(size-URL_SIZE)/(HOME_SIZE-URL_SIZE)));
    const width = target[i].width + (home[i].width-target[i].width)*t;
    // At the URL, each hit area occupies only its own character cell.
    // The old 78-unit circles overlapped neighboring letters.
    const padding = 8*t;
    hits[i].setAttribute("x",-padding);
    hits[i].setAttribute("y",-ink.ascent*scale-14);
    hits[i].setAttribute("width",width+2*padding);
    hits[i].setAttribute("height",(ink.ascent+ink.descent)*scale+28);
  }

  function currentMover(i){
    const consolidated = movers[i].transform.baseVal.consolidate();
    const matrix = consolidated ? consolidated.matrix : {e:0,f:0};

    return {
      x: matrix.e,
      y: matrix.f,
      size: Number(glyphs[i].getAttribute("font-size")) || HOME_SIZE
    };
  }

  function allPlaced(){
    return placed.every(Boolean);
  }

  function layout(){
    if(active || busy.some(Boolean)){
      requestAnimationFrame(layout);
      return;
    }
    /*
      Exact source positions: the baseline origin of each bold placeholder.
    */
    home = homeSlots.map(slotOrigin);

    /*
      Exact destination positions:
      baseline origins of three real, bold reserved w glyphs in the final URL,
      on the URL baseline.

      Therefore the final letters are literally in the positions that
      "www.pilemma.org" would occupy — no guessed x values.
    */
    target = urlSlots.map(slotOrigin);

    measure.font = `600 ${HOME_SIZE}px ${getComputedStyle(glyphs[0]).fontFamily}`;
    const metrics = measure.measureText("w");
    ink = {
      left:-metrics.actualBoundingBoxLeft,
      right:metrics.actualBoundingBoxRight,
      ascent:metrics.actualBoundingBoxAscent,
      descent:metrics.actualBoundingBoxDescent
    };

    // Punctuation is a separate overlay: hiding "is" never moves the text.
    const hereEnd = hereWord.getEndPositionOfChar(hereWord.getNumberOfChars()-1);
    colon.setAttribute("x",hereEnd.x);
    colon.setAttribute("y",hereEnd.y);

    // Derive each dot from its own w's ink center, without compressing the row.
    // Keep the destination array, letter widths, and drop zone unchanged.
    const scale = URL_SIZE/HOME_SIZE;
    const inkCenter = (ink.left+ink.right)*scale/2;
    dots.forEach((dot,i) => {
      dot.setAttribute("cx", target[i].x+inkCenter);
      dot.setAttribute("cy", target[i].y+(ink.descent-ink.ascent)*scale/2);
    });

    /*
      Drop target = union of the three reserved URL w glyph boxes,
      padded slightly for touch.
    */
    const first = target[0];
    const last = target[2];

    const left = first.x - 18;
    const right = last.x + last.width + 18;

    dropZone.setAttribute("x", left);
    dropZone.setAttribute("y", 205);
    dropZone.setAttribute("width", right-left);
    dropZone.setAttribute("height", 76);

    /*
      Resize/font changes never alter state.
    */
    movers.forEach((_,i) => {
      setMover(
        i,
        placed[i] ? target[i] : home[i],
        placed[i] ? URL_SIZE : HOME_SIZE
      );
    });
  }

  function sync(){
    dots.forEach((dot,i) => {
      dot.style.opacity = placed[i] ? "0" : "1";
      movers[i].setAttribute("aria-pressed",String(placed[i]));
      movers[i].setAttribute("aria-label",placed[i]
        ? `Return w ${i+1} to ${["where","whole","wand"][i]}`
        : `Move w ${i+1} to dot ${i+1}`);
    });

    // Completion reads "here: the hole and"; restore "is" and "?" on return.
    const complete = allPlaced();
    qmark.style.opacity = complete ? "0" : "1";
    isWord.style.opacity = complete ? "0" : "1";
    colon.style.opacity = complete ? "1" : "0";

    document.title = allPlaced()
      ? "www.pilemma.org"
      : "pilemma";
  }

  function inDropZone(p){
    const b = dropZone.getBBox();

    return (
      p.x >= b.x &&
      p.x <= b.x + b.width &&
      p.y >= b.y &&
      p.y <= b.y + b.height
    );
  }

  function near(p,q,r=74){
    return Math.hypot(p.x-q.x,p.y-q.y) <= r;
  }

  function animateTo(i, destination, destinationSize){
    const start = currentMover(i);

    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      setMover(i,destination,destinationSize);
      return Promise.resolve();
    }

    return new Promise(resolve => {
      const startTime = performance.now();
      const duration = 250;

      function frame(now){
        const t = Math.min(1,(now-startTime)/duration);
        const e = 1 - Math.pow(1-t,3);

        setMover(i,{
          x: start.x + (destination.x-start.x)*e,
          y: start.y + (destination.y-start.y)*e
        }, start.size + (destinationSize-start.size)*e);

        if(t < 1){
          requestAnimationFrame(frame);
        }else{
          resolve();
        }
      }

      requestAnimationFrame(frame);
    });
  }

  async function toggle(i){
    if(busy[i]) return;
    busy[i] = true;

    const goingDown = !placed[i];

    /*
      The dot disappears as its own w arrives;
      on return it reappears immediately as the w leaves.
    */
    if(!goingDown){
      placed[i] = false;
      sync();
    }

    await animateTo(
      i,
      goingDown ? target[i] : home[i],
      goingDown ? URL_SIZE : HOME_SIZE
    );

    if(goingDown){
      placed[i] = true;
      sync();
    }

    busy[i] = false;
  }

  movers.forEach((mover,i) => {

    mover.addEventListener("keydown", evt => {
      if(evt.key === "Enter" || evt.key === " "){
        evt.preventDefault();
        if(!active) toggle(i);
      }
    });

    mover.addEventListener("pointerdown", evt => {
      if(busy[i] || active || evt.isPrimary === false || evt.button !== 0) return;

      evt.preventDefault();

      const p = clientToSvg(evt);
      const start = currentMover(i);

      active = {
        i,
        pointerId: evt.pointerId,
        down: p,
        clientDown:{x:evt.clientX,y:evt.clientY},
        start,
        moved: false
      };

      mover.classList.add("dragging");

      try{
        mover.setPointerCapture(evt.pointerId);
      }catch(_){}
    });

    mover.addEventListener("pointermove", evt => {
      if(
        !active ||
        active.i !== i ||
        active.pointerId !== evt.pointerId
      ) return;

      evt.preventDefault();

      const p = clientToSvg(evt);
      const dx = p.x-active.down.x;
      const dy = p.y-active.down.y;

      if(Math.hypot(evt.clientX-active.clientDown.x,evt.clientY-active.clientDown.y) > 5){
        active.moved = true;
      }

      if(!active.moved) return;

      setMover(i,{
        x: active.start.x + dx,
        y: active.start.y + dy
      },active.start.size);

      dropZone.classList.toggle(
        "active",
        !placed[i] && inDropZone(p)
      );
    });

    mover.addEventListener("pointerup", async evt => {
      if(
        !active ||
        active.i !== i ||
        active.pointerId !== evt.pointerId
      ) return;

      evt.preventDefault();

      const p = clientToSvg(evt);
      const moved = active.moved;

      try{
        mover.releasePointerCapture(evt.pointerId);
      }catch(_){}

      mover.classList.remove("dragging");
      dropZone.classList.remove("active");
      active = null;

      /*
        CLICK BEHAVIOR:
        top w -> its own dot
        same bottom w -> back to its own word
      */
      if(!moved){
        await toggle(i);
        return;
      }

      /*
        DRAG BEHAVIOR:
        source -> any point in the three-slot drop zone
        but it ALWAYS snaps into its OWN numbered slot.
      */
      if(!placed[i] && inDropZone(p)){
        busy[i] = true;

        await animateTo(i,target[i],URL_SIZE);
        placed[i] = true;
        sync();

        busy[i] = false;
        return;
      }

      /*
        A bottom w can also be dragged back near its own source.
      */
      if(placed[i] && near(p,home[i])){
        busy[i] = true;

        placed[i] = false;
        sync();

        await animateTo(i,home[i],HOME_SIZE);

        busy[i] = false;
        return;
      }

      /*
        Invalid drag: return to whichever state it came from.
      */
      busy[i] = true;

      await animateTo(
        i,
        placed[i] ? target[i] : home[i],
        placed[i] ? URL_SIZE : HOME_SIZE
      );

      busy[i] = false;
    });

    mover.addEventListener("pointercancel", async evt => {
      if(
        !active ||
        active.i !== i ||
        active.pointerId !== evt.pointerId
      ) return;

      try{
        mover.releasePointerCapture(evt.pointerId);
      }catch(_){}

      mover.classList.remove("dragging");
      dropZone.classList.remove("active");
      active = null;

      busy[i] = true;
      await animateTo(
        i,
        placed[i] ? target[i] : home[i],
        placed[i] ? URL_SIZE : HOME_SIZE
      );
      busy[i] = false;
    });
  });

  requestAnimationFrame(() => {
    layout();
    sync();
  });

  /*
    Re-measure after Afacad is actually available.
    This is important: the slot geometry comes from the real font,
    not from fallback-font guesses.
  */
  if(document.fonts?.ready){
    document.fonts.ready.then(() => {
      layout();
      sync();
    });
  }

  window.addEventListener("resize",layout);
})();
</script>
</body>
</html>
